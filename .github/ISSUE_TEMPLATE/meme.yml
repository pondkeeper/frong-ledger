name: 🐸 Submit a meme to the pond
description: Toss a FRONG meme into the Meme Pond so everyone can use it.
title: "[meme] "
labels: ["meme"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for feeding the pond. Drag your image into the box below (PNG, JPG, GIF or WebP — keep it under 4 MB).
        The pondkeeper reviews submissions and adds the good ones to https://pondkeeper.github.io/frong-ledger/memes.html
  - type: textarea
    id: image
    attributes:
      label: Your meme
      description: Drag & drop or paste the image here. One meme per issue — open another for the next one.
      placeholder: Drop the image file into this box…
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: A short name for the gallery (e.g. "Whales are accumulating")
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: A handle to credit under the meme, if you want one. Leave blank to stay anonymous.
  - type: checkboxes
    id: rules
    attributes:
      label: Pond rules
      options:
        - label: It's mine to share (I made it, or it's a remix of free/community material) and everyone may reuse it.
          required: true
        - label: It's not NSFW, hateful, or targeting a real person.
          required: true
