name: refresh-data
on:
  schedule:
    # offset from :00/:10 marks — GitHub deprioritizes the congested slots
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline
        env:
          # launch-window value while Blockscout 5xx's (2026-09-06): partial refreshes commit and the page
          # labels the wallets kept from the previous run; raise back to 0.6 when a run refreshes >= 40/50 again
          REFRESH_MIN_FRACTION: "0.2"
        run: python3 pipeline/refresh.py
      - name: Commit data
        run: |
          git config user.name "frong-ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

